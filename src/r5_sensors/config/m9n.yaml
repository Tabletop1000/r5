# Configuration Settings for C94-M8P device
ublox_gps_node:
  ros__parameters:
    debug: 0                    # Range 0-4 (0 means no debug statements will print)
    device: /dev/ttyACM0
    frame_id: gps_link
    rate: 1.0
    nav_rate: 1
    fix_mode: 3d

    gnss:
      glonass: true
      galileo: true
      sbas: true
      beidou: true
      qzss: true
    uart1:
      baudrate: 115200

    inf:
      all: true                   # Whether to display all INF messages in console
    
    publish:
      all: true
      aid:
        hui: false
      nav:
        posecef: false