# Nav2 for R5: GPS waypoints in open ground, with no map, AMCL or obstacle sensors.
# Position comes from r5_localisation through map -> odom -> base_footprint.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # No recovery behaviours: with no obstacle sensing the robot stops on failure.
    default_nav_to_pose_bt_xml: "$(find-pkg-share r5_navigation)/behavior_trees/navigate_to_pose.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # Matches the controller_manager update_rate. Faster commands would be dropped.
    controller_frequency: 10.0
    odom_topic: /odometry/local
    # diff_drive_controller only accepts TwistStamped on Jazzy.
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    # Allows for the M9N wandering. Tighten it once RTK is fitted. Any final heading is
    # accepted. Keep this below FollowPath.lookahead_dist: the controller compares this
    # tolerance with its lookahead distance, and stops dead if the lookahead is shorter.
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 1.5
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3  # linear.x.max_velocity in diffbot_controllers.yaml
      lookahead_dist: 2.0  # must stay above xy_goal_tolerance and inside the local costmap
      use_velocity_scaled_lookahead_dist: false
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.0  # angular.z.max_acceleration in diffbot_controllers.yaml
      allow_reversing: false
      transform_tolerance: 0.3
      # These need obstacle data. Turn them on with the lidar.
      use_collision_detection: false
      use_cost_regulated_linear_velocity_scaling: false

# The costmaps stay empty until the lidar has a driver, so nothing stops the robot hitting
# obstacles. They have an inflation layer only, because a costmap needs at least one plugin.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 1.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      robot_radius: 0.4
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 0.5
      # There's no static map, so this window follows the robot. A goal outside it can't be
      # planned to, which limits a waypoint to 60 m away.
      rolling_window: true
      width: 120
      height: 120
      resolution: 0.25
      track_unknown_space: false
      robot_radius: 0.4
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

waypoint_follower:
  ros__parameters:
    loop_rate: 10
    # Stop at a failed waypoint rather than driving on to the next one.
    stop_on_failure: true
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    enable_stamped_cmd_vel: true
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Same limits as diffbot_controllers.yaml, with gentler linear acceleration.
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
